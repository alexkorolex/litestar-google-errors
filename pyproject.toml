[project]
name = "litestar-google-errors"
version = "0.1.0"
description = "Litestar plugin that documents HTTPException responses in OpenAPI using the Google JSON error format"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "alexkorolex" }]
keywords = ["litestar", "openapi", "errors", "google-json-style"]
classifiers = [
    "Framework :: Litestar",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = ["litestar>=2.16,<3"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litestar_google_errors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
